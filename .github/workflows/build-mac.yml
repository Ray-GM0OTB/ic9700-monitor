# Builds IC9700 Monitor for the Mac on GitHub's Mac machines, checks that the app opens,
# and puts the .dmg installers on the release page "IC9700 Monitor <version> for Mac".
name: Build Mac app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "IC9700.py"
      - "build_mac.sh"
      - "ic9700.png"
      - ".github/workflows/build-mac.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple silicon (M1 and later Mac mini)
            arch: arm64
            optional: false
          - runner: macos-15-intel    # Intel Macs
            arch: x86_64
            optional: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12 from python.org (includes Tk)
        run: |
          curl -fsSL -o python.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg python.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.12/bin" >> "$GITHUB_PATH"

      - name: Build the app and the .dmg
        run: PYTHON=python3.12 ./build_mac.sh

      - name: Check the app opens (self-test)
        run: |
          EXE="dist/IC9700 Monitor.app/Contents/MacOS/IC9700 Monitor"
          IC9700_SELFTEST=1 IC9700_SELFTEST_MS=9000 "$EXE" > selftest.log 2>&1 &
          PID=$!
          sleep 7
          screencapture -x "screenshot_mac_${{ matrix.arch }}.png" || true
          wait $PID || true
          cat selftest.log
          grep -q "SELFTEST OK" selftest.log

      - name: Keep the build files
        uses: actions/upload-artifact@v4
        with:
          name: ic9700-monitor-mac-${{ matrix.arch }}
          path: |
            IC9700_Monitor_*_mac_*.dmg
            screenshot_mac_*.png
            selftest.log

      - name: Publish on the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3.12 -c "import re;print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('IC9700.py').read()).group(1))")
          TAG="v${VER}-mac"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "IC9700 Monitor $VER for Mac" \
              --notes-file docs/mac-release-notes.md || sleep 10
          fi
          gh release upload "$TAG" IC9700_Monitor_*_mac_${{ matrix.arch }}.dmg --clobber
          if [ -f "screenshot_mac_${{ matrix.arch }}.png" ]; then
            gh release upload "$TAG" "screenshot_mac_${{ matrix.arch }}.png" --clobber || true
          fi
